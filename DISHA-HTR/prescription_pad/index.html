<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>DISHA — Digital Prescription Pad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="page-head">
      <p class="eyebrow">DISHA · CLINICIAN WRITING · TESTING BUILD</p>
      <h1>Digital Prescription Pad</h1>
    </header>

    <section class="org-card rx-header" aria-label="Facility and clinician">
      <div class="logo-box" aria-hidden="true">LOGO</div>
      <div class="hospital">
        <h2>Sunrise Community Hospital</h2>
      </div>
      <div class="doctor-block">
        <label class="field-label" for="doctorSelect">Clinician</label>
        <select id="doctorSelect"></select>
        <p id="doctorMeta" class="doctor-meta" hidden></p>
      </div>
    </section>

    <section class="patient-card" aria-label="Patient details">
      <label class="field">Patient name
        <input id="patientName" type="text" autocomplete="off" />
      </label>
      <label class="field">Patient ID
        <input id="patientId" type="text" autocomplete="off" />
      </label>
      <label class="field">Age
        <input id="patientAge" type="text" inputmode="numeric" autocomplete="off" />
      </label>
      <label class="field">Visit date
        <input id="visitDate" type="date" />
      </label>
    </section>

    <section class="toolbar-card" role="toolbar" aria-label="Writing tools">
      <label class="tool">Colour
        <input id="penColor" type="color" value="#1e293b" />
      </label>
      <label class="tool tool-thickness">Thickness
        <input id="penWidth" type="range" min="1" max="12" value="3" />
        <span id="penWidthLabel">3</span>
      </label>
      <span class="tool-sep" aria-hidden="true"></span>
      <button type="button" id="btnUndo" class="btn">Undo</button>
      <button type="button" id="btnClear" class="btn btn-warn">Clear</button>
      <span class="tool-sep" aria-hidden="true"></span>
      <button type="button" id="btnRecognizePad" class="btn">Recognize handwriting</button>
      <button type="button" id="btnSave" class="btn btn-primary">Save prescription</button>
      <span class="tool-sep grow" aria-hidden="true"></span>
      <button type="button" id="btnExportPng" class="btn">Export PNG</button>
      <button type="button" id="btnExportJson" class="btn">Export strokes JSON</button>
    </section>
    <p class="pad-rec-status" id="padRecStatus" aria-live="polite"></p>

    <section class="workspace" aria-label="Writing workspace">
      <div class="canvas-panel">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="rxCanvas" width="1000" height="560" aria-label="Handwriting prescription canvas"></canvas>
        </div>
      </div>

      <aside class="side-panel">
        <div class="draft-card" aria-label="Optional typed draft">
          <div class="draft-head">
            <h3>Optional typed draft</h3>
            <span class="draft-badge">Human draft only.</span>
          </div>
          <label class="field">Diagnosis (draft)
            <input id="draftDiagnosis" type="text" autocomplete="off" placeholder="Testing draft only" />
          </label>
          <label class="field">Medication name (draft)
            <input id="draftMedicines" type="text" autocomplete="off" placeholder="e.g. Paracetamol" />
          </label>
          <label class="field">Frequency (draft)
            <input id="draftFrequency" type="text" autocomplete="off" placeholder="e.g. 1-0-1" />
          </label>
          <label class="field">Duration (draft)
            <input id="draftDuration" type="text" autocomplete="off" placeholder="e.g. 5 days" />
          </label>
          <!-- Kept for existing save/reopen JS; not shown in mockup -->
          <input id="draftDosage" type="hidden" value="" />
          <input id="draftInstructions" type="hidden" value="" />
          <label class="field field-area">Original transcription draft
            <textarea id="draftTranscription" rows="4" placeholder="Typed (draft) of the handwriting..."></textarea>
          </label>
        </div>

        <div class="saved-card" aria-label="Saved local testing records">
          <div class="saved-head">
            <h3>Saved local testing records</h3>
            <button type="button" id="btnRefreshSaved" class="btn btn-sm">Refresh</button>
          </div>
          <div id="savedList" class="saved-list"></div>
          <div id="preview" class="preview hidden">
            <h4>Preview</h4>
            <img id="previewImg" alt="Saved prescription preview" />
            <pre id="previewMeta"></pre>
          </div>
        </div>
      </aside>
    </section>

    <!-- Footer sync targets used by app.js -->
    <div class="sr-only" aria-hidden="true">
      <span id="footerPatient">—</span>
      <span id="footerId">—</span>
      <span id="footerAge">—</span>
      <span id="footerDate">—</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
